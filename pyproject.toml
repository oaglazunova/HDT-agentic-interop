[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdt-agentic-interop"
version = "0.5.0"
description = "Interoperable HDT prototype with MCP façade, vault, policy lanes, and telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olga Glazunova", email = "o.glazunova@tue.nl" }]
keywords = ["Model Context Protocol", "HDT", "interoperability", "digital health", "agentic systems"]

dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "mcp>=1.24,<2",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "a2a-sdk[http-server]>=0.3.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "tzdata",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/oaglazunova/HDT-agentic-interop"
Repository = "https://github.com/oaglazunova/HDT-agentic-interop"
Issues = "https://github.com/oaglazunova/HDT-agentic-interop/issues"

[project.scripts]
hdt-mcp = "hdt_mcp.gateway:main"
hdt-sources = "hdt_sources_mcp.server:main"
hdt-provider-a2a = "hdt_provider_a2a.server:main"
hdt-user-a2a = "hdt_user_a2a.server:main"
hdt-a2a-negotiate = "hdt_a2a.host.run_negotiation:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: integration tests (opt-in; run with --run-integration)",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "hdt_mcp*",
  "hdt_sources_mcp*",
  "hdt_config*",
  "hdt_common*",
  "hdt_mapping_plan*",
  "hdt_a2a*",
  "hdt_provider_a2a*",
  "hdt_user_a2a*",
]
# This is where exclusion belongs (package discovery), not under package-data.
exclude = [
  "tests*",
  "docs*",
  "scripts*",
  "data*",
  "datasets*",
  "demo*",
  "artifacts*",
  "examples*",
]

[tool.setuptools.package-data]
hdt_mapping_plan = ["schema/*.json", "examples/*.json", "allowed_ops_profile.json"]
hdt_provider_a2a = ["contracts/**/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"tests/**" = ["E501"]